# Production: docker compose -f docker-compose.prod.yml up -d --build
# Faqat Caddy (80/443) tashqariga ochiq. Baza va backend faqat ichki tarmoqda.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: factory_db
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da yo'q}
      TZ: Asia/Tashkent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d factory_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 12 GB RAM'li serverga mos, kichik hisob tizimi uchun yengil sozlama
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c max_connections=50
      -c timezone=Asia/Tashkent

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://factory:${POSTGRES_PASSWORD}@db:5432/factory_db
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env da yo'q}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ROOT_PATH: /api
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      TZ: Asia/Tashkent
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
